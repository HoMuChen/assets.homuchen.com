<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Assets · 離線</title>
    <style>
      :root { color-scheme: dark; --bg: #08090a; --fg: #f7f8f8; --fg-3: #8a8f98; --accent: #5e6ad2; --border: rgba(255, 255, 255, 0.12); }
      @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f7f8f8; --fg: #0f1011; --fg-3: #6b6f76; --border: rgba(0, 0, 0, 0.14); } }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, "PingFang TC", "Noto Sans TC", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
      p { margin: 0; color: var(--fg-3); font-size: 13px; }
      button { margin-top: 8px; height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7480e8"/><stop offset="1" stop-color="#4a53b8"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#b)"/><path d="M24 66 L42 46 L55 56 L76 32 L76 76 L24 76 Z" fill="url(#a)"/><path d="M24 66 L42 46 L55 56 L76 32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="32" r="6.5" fill="#fff"/></svg>
      <strong>目前沒有網路連線</strong>
      <p>資產數字需要即時資料，連上網路後再試一次。</p>
      <button type="button" onclick="location.reload()">重新整理</button>
    </main>
  </body>
</html>
